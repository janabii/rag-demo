<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llama 2 Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>janabii/Rag-demo Ask the chatbot</h1>
    <form id="askForm">
        <label for="question">Your question:</label>
        <input type="text" id="question" name="question" required>
        <button type="submit">Ask</button>
    </form>

    <h2>Response:</h2>
    <p id="response"></p>

    <!-- Loading Spinner -->
    <div id="loading" style="display: none;">
        <div class="spinner"></div> Loading...
    </div>

    <script src="/static/script.js"></script>

    <script>
        document.getElementById("askForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const question = document.getElementById("question").value;
            
            document.getElementById("loading").style.display = "block";

            try {
                const response = await fetch("http://0.0.0.0:8000/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ question: question })
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById("response").textContent = data.answer;
                } else {
                    document.getElementById("response").textContent = "Error: Unable to fetch response";
                }
            } catch (error) {
                document.getElementById("response").textContent = "Error: Unable to fetch response";
            } finally {`
                document.getElementById("loading").style.display = "none";
            }
        });
    </script>
</body>
</html>
